worker_processes 1;

events {
    worker_connections 512;
}

http {
    default_type application/json;

    log_format gateway '$remote_addr "$request" $status -> $upstream_addr';
    access_log logs/gateway.log gateway;

    upstream productos {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    upstream ordenes {
        server 127.0.0.1:8082;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name localhost;

        error_page 502 503 504 = @caido;

        # grpc_pass manda la peticion a los microservicios en HTTP/2
        location ~ ^/api/productos(/.*)?$ {
            rewrite ^/api(/.*)$ $1 break;
            grpc_pass grpc://productos;
        }

        location ~ ^/api/ordenes(/.*)?$ {
            rewrite ^/api(/.*)$ $1 break;
            grpc_pass grpc://ordenes;
        }

        location / {
            return 404 '{"mensaje":"Ruta no encontrada"}';
        }

        location @caido {
            return 503 '{"mensaje":"El servicio no esta disponible"}';
        }
    }
}
